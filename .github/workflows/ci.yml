name: JOCKY-X detection CI
on: [push, pull_request]
jobs:
  detection-lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - name: Unit + integration tests
        run: python -m pytest -q
      - name: Detection regression lab (rules x traces; rejects regressing rules)
        run: python -m jockyx ci
      - name: Upload deployable rule bundle
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with: {name: deployed_rules, path: build/deployed_rules.json}
